# The website, with the API and Django's admin passed through to Gunicorn.
# They share one domain because sign-in depends on cookies.
# setup.sh fills in the domain; Certbot then adds the HTTPS settings.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    root /opt/geoalert/frontend/build;
    index index.html;

    # History imports are up to 10 MB, and a report can carry several 5 MB photos
    client_max_body_size 30m;

    gzip on;
    gzip_min_length 1024;
    gzip_types application/json application/geo+json application/javascript text/css image/svg+xml;

    location ~ ^/(api|django-admin)/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
    }

    # The website and Django's admin both keep their files under /static/
    location /static/ {
        expires 30d;
        try_files $uri @django_static;
    }

    location @django_static {
        root /opt/geoalert/backend/staticfiles;
        rewrite ^/static/(.*)$ /$1 break;
    }

    # Always fetched fresh, so a new release reaches people straight away
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Every other address is a page of the React app
    location / {
        try_files $uri /index.html;
    }
}
