# The website, with the API and Django's admin passed through to Gunicorn.
# They share one domain because sign-in depends on cookies.
# setup.sh fills in the domain; Certbot then adds the HTTPS settings.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    root /opt/geoalert/frontend/build;
    index index.html;

    # History imports are up to 10 MB, and a report can carry several 5 MB photos
    client_max_body_size 30m;

    gzip on;
    gzip_min_length 1024;
    gzip_types application/json application/geo+json application/javascript text/css image/svg+xml;

    location ~ ^/(api|django-admin)/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
    }

    # The website and Django's admin both keep their files under /static/
    location /static/ {
        expires 30d;
        try_files $uri @django_static;
    }

    location @django_static {
        root /opt/geoalert/backend/staticfiles;
        rewrite ^/static/(.*)$ /$1 break;
    }

    # Always fetched fresh, so a new release reaches people straight away.
    # Every page of the app is this file, so its headers are the pages':
    # never inside another site's frame, and no full address sent to others.
    # (A location with its own add_header doesn't inherit the server's, so
    # they are repeated here and below; Django sets its own on /api/.)
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    }

    # Every other address is a page of the React app
    location / {
        try_files $uri /index.html;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
